<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree Matrix | @crossrazer</title>
    
    <!-- Importação dos Ícones (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Estilo para o Canvas (Fundo Matrix) */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Estrutura Geral */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: black;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: rgba(18, 18, 18, 0.85);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            backdrop-filter: blur(5px);
        }

        .logo-img {
            width: 120px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid #00ff41;
        }

        h1 {
            font-size: 1.4rem;
            color: #00ff41;
            margin-bottom: 30px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        /* Estilo dos Botões */
        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-decoration: none;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #00ff41;
        }

        .link i {
            margin-right: 15px;
            font-size: 1.3rem;
        }

        /* Efeitos de Hover */
        .link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ff41;
        }

        .link-youtube:hover { background-color: #FF0000; border-color: #FF0000; }
        .link-discord:hover { background-color: #5865F2; border-color: #5865F2; }
        .link-tiktok:hover { background-color: #000000; border-color: #69C9D0; }
        .link-livepix:hover { background-color: #00ff41; color: black; border-color: #00ff41; }
        .link-itch:hover { background-color: #fa5c5c; border-color: #fa5c5c; }

    </style>
</head>
<body>

    <!-- Elemento para a animação Matrix -->
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <img src="https://i.ibb.co/zTtq65rq/MINHA-LOGO.png" alt="Logo @crossrazer" class="logo-img">
        <h1>@crossrazer</h1>

        <!-- Links das Redes Sociais -->
        <a href="https://www.youtube.com/@crossrazerYT" class="link link-youtube" target="_blank">
            <i class="fa-brands fa-youtube"></i> YouTube
        </a>

        <a href="https://discord.gg/udJSFzuQf4" class="link link-discord" target="_blank">
            <i class="fa-brands fa-discord"></i> Discord
        </a>

        <a href="https://www.tiktok.com/@crossrazerttk" class="link link-tiktok" target="_blank">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </a>

        <a href="https://livepix.gg/crossrazer" class="link link-livepix" target="_blank">
            <i class="fa-solid fa-hand-holding-dollar"></i> Live-Pix
        </a>

        <!-- Novo Botão Itch.io -->
        <a href="https://maltastudio.itch.io/enfynyty#download" class="link link-itch" target="_blank">
            <i class="fa-solid fa-gamepad"></i> Enfynyty (Itch.io)
        </a>
    </div>

    <!-- Script da Matrix -->
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ff41"; 
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 33);
    </script>

</body>
</html>
